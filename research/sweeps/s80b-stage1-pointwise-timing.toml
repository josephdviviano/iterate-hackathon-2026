# Same-GPU paired timing (GPU 1) of the 1x1 stage-1 residual, max-autotune; ABBA blocks.
name = "s80b-stage1-pointwise-timing"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [8310, 8311, 8312, 8313, 8314, 8315, 8316, 8317, 8318, 8319]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
stage_depths = [3, 2, 3]
stage_skips = [false, true, false]
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
trim_tail = true
label_smoothing = 0.4
epochs = 8.25
compile_mode = "max-autotune"

[[configs]]
residual_kernels = [1, 3, 3]
[[configs]]                                   # control (= submission)
