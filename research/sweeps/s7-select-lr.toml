# Hill climb step 7 (X-002): in-run example selection (airbench96_faster, online form),
# CUDA-graph compilation (max-autotune) with fused SGD, and a learning-rate step,
# each against an in-sweep control at the S5 base.
name = "s7-select-lr"
python = ".venv-blackwell/bin/python"
seeds = [0, 1, 2, 3, 4]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 512]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]

[[grid]]
epochs = [10, 12]

[[grid]]
select_fraction = [0.5]
epochs = [10, 12, 14]

[[grid]]
select_fraction = [0.7]
epochs = [10, 12]

[[grid]]
compile = [true]
compile_mode = ["max-autotune"]
fused_sgd = [true]
epochs = [10, 12]

[[grid]]
lr = [9.2, 14.4]
epochs = [10, 12]
