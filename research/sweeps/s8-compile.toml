# Hill climb step 8 (X-002): decompose S6's compile + fused SGD arm (11% faster per epoch,
# 0.41 pp lower at 10 epochs) into compile-only and fused-only, with 10 fresh seeds near the
# target knee (9 and 10 epochs).
name = "s8-compile"
python = ".venv-blackwell/bin/python"
seeds = [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 512]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]

[[grid]]
epochs = [9, 10]
compile = [false, true]
fused_sgd = [false, true]
