# 40-fresh-seed confirmation of the S33 interaction (X-005): WSD (decay start 0.6) with
# class-balanced order gave +0.20 pp although neither lever helped alone (best of 5 arms).
name = "s34-wsd-balanced-confirm"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [3400, 3401, 3402, 3403, 3404, 3405, 3406, 3407, 3408, 3409, 3410, 3411, 3412, 3413, 3414, 3415, 3416, 3417, 3418, 3419, 3420, 3421, 3422, 3423, 3424, 3425, 3426, 3427, 3428, 3429, 3430, 3431, 3432, 3433, 3434, 3435, 3436, 3437, 3438, 3439]
