# Hill climb step 4 (X-002 probe S4): one lever at a time at the S3 base
# (128/384/512, three convs per block, translate 2), bracketing the target at 8 and 10 epochs.
name = "s4-levers"
python = ".venv-blackwell/bin/python"
seeds = [0, 1, 2, 3, 4]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 512]
block_depth = 3
translate = 2

[[grid]]
epochs = [8, 10]

[[grid]]
epochs = [8, 10]
translate = [0, 1]

[[grid]]
epochs = [8, 10]
label_smoothing = [0.1]

[[grid]]
epochs = [8, 10]
lookahead = [false]

[[grid]]
epochs = [8, 10]
batch_size = [1536, 2048]

[[grid]]
epochs = [8, 10]
optimizer = ["muon"]
head_norm = [true]
lookahead = [false]
batch_size = [1024, 2000]

[[grid]]
epochs = [8, 10]
res_schedule = [[[0.0, 24], [0.5, 32]]]

[[grid]]
epochs = [8, 10]
widths = [[128, 512, 768]]
