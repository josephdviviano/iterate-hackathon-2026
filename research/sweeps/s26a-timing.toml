# Interleaved timing confirmation (X-004), block a: CUDA graphs and flatten-max pool vs control.
# Two blocks with disjoint seeds and opposite config order; compare arms within each block.
name = "s26a-timing"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [1400, 1401, 1402, 1403, 1404]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
compile = true
fused_sgd = true
epochs = 8.25

[[configs]]                 # control
compile_mode = "default"
[[configs]]                 # ro
compile_mode = "reduce-overhead"
[[configs]]                 # flat
global_pool = "flatmax"
[[configs]]                 # ro_flat
compile_mode = "reduce-overhead"
global_pool = "flatmax"
[[configs]]                 # ma_flat
compile_mode = "max-autotune"
global_pool = "flatmax"
