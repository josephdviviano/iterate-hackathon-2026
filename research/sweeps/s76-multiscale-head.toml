# Multi-scale head on the D-014 base: one linear head on [global max of stage 3, global max of
# stage 2] (differs from the rejected multi-exit, which averaged two separate heads), at the
# default logit scale and at 1/7 for the wider fan-in. 20 seeds, both GPUs.
name = "s76-multiscale-head"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [7900, 7901, 7902, 7903, 7904, 7905, 7906, 7907, 7908, 7909,
         7910, 7911, 7912, 7913, 7914, 7915, 7916, 7917, 7918, 7919]
devices = [0, 1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
stage_depths = [3, 2, 3]
stage_skips = [false, true, false]
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
trim_tail = true
label_smoothing = 0.4
epochs = 8.25

[[configs]]                                   # control (= submission)
[[configs]]
head_multiscale = true
[[configs]]
head_multiscale = true
scaling_factor = 0.14285714285714285
