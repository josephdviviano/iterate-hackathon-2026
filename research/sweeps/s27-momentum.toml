# Confirm and climb the S21 momentum candidate (0.8: +0.23 pp over 10 seeds) on 20 fresh seeds.
# airbench's decoupled parametrisation keeps step size and decay strength fixed as momentum changes.
name = "s27-momentum"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [1500, 1501, 1502, 1503, 1504, 1505, 1506, 1507, 1508, 1509, 1510, 1511, 1512, 1513, 1514, 1515, 1516, 1517, 1518, 1519]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
compile = true
fused_sgd = true
epochs = 8.25

[[grid]]
momentum = [0.85, 0.8, 0.75]
