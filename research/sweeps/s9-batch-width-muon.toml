# Hill climb step 9 (X-002): smaller batches (S4 showed larger batches hurt), width
# allocation around 128/384/512, and a Muon retune (the faithful airbench94_muon port lost
# ~1 pp in S4), each at 9 and 10 epochs against an in-sweep control.
name = "s9-batch-width-muon"
python = ".venv-blackwell/bin/python"
seeds = [0, 1, 2, 3, 4]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 512]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]

[[grid]]
epochs = [9, 10]
batch_size = [512, 768, 1024]

[[grid]]
epochs = [9, 10]
widths = [[128, 384, 640], [128, 448, 512], [96, 384, 512], [160, 384, 512]]

[[grid]]
epochs = [9, 10]
optimizer = ["muon"]
lookahead = [true]
head_norm = [false]
muon_lr = [0.12, 0.24]
