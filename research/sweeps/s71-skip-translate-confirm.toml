# Fresh-seed confirmation of the S70 near-threshold arms: identity skip around stage 2, translate 1
# in the 20 px epochs, and both. 40 fresh seeds; timing in S72a/b.
name = "s71-skip-translate-confirm"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [7500, 7501, 7502, 7503, 7504, 7505, 7506, 7507, 7508, 7509, 7510, 7511, 7512, 7513, 7514, 7515, 7516, 7517, 7518, 7519, 7520, 7521, 7522, 7523, 7524, 7525, 7526, 7527, 7528, 7529, 7530, 7531, 7532, 7533, 7534, 7535, 7536, 7537, 7538, 7539]
devices = [0, 1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
stage_depths = [3, 2, 3]
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
trim_tail = true
label_smoothing = 0.4
epochs = 8.25

[[configs]]                                   # control (= submission)
[[configs]]
stage_skips = [false, true, false]
[[configs]]
translate_low = 1
[[configs]]
stage_skips = [false, true, false]
translate_low = 1
