# Modal A100 same-host paired timing of the exact-lever stack after M5 (H1 rejected: +1.2%).
# 4 hosts x 2 alternating-order blocks x 5 seeds; PCIe hosts are reported separately.
#   .venv-modal/bin/modal run research/modal_a100.py::interleave --sweep research/sweeps/m6-exact-stack-paired.toml --hosts 4
name = "m6-exact-stack-paired"
submission = "research/lab_recipe"
seeds = [3700, 3701, 3702, 3703, 3704, 3705, 3706, 3707, 3708, 3709,
         3710, 3711, 3712, 3713, 3714, 3715, 3716, 3717, 3718, 3719,
         3720, 3721, 3722, 3723, 3724, 3725, 3726, 3727, 3728, 3729,
         3730, 3731, 3732, 3733, 3734, 3735, 3736, 3737, 3738, 3739]
devices = []

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
compile_mode = "max-autotune"
fused_sgd = true
epochs = 8.25

[[configs]]                                   # control (= submission)
[[configs]]
whiten_grad_off = true
[[configs]]
whiten_grad_off = true
compile_loss = true
[[configs]]                                   # exact stack
whiten_grad_off = true
compile_loss = true
coordinate_descent = true
cudnn_benchmark_limit = 0
