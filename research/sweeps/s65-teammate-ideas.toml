# Untested techniques from the teammates' branches, on the D-013 base: an lr floor reached early
# and held (youssef-hypothesis I074's Fable-style tail), lookahead base decay 0.97 (dr I032), and a
# short 28 px phase at the start of the 32 px phase (hypothesis I096, dr I061). 20 seeds.
name = "s65-teammate-ideas"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [6800, 6801, 6802, 6803, 6804, 6805, 6806, 6807, 6808, 6809,
         6810, 6811, 6812, 6813, 6814, 6815, 6816, 6817, 6818, 6819]
devices = [0, 1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
stage_depths = [3, 2, 3]
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
trim_tail = true
label_smoothing = 0.4
epochs = 8.25

[[configs]]                                   # control (= submission)
[[configs]]
lr_decay_end = 0.96                           # floor from 96%, held
[[configs]]
lr_decay_end = 0.9
[[configs]]
lookahead_base = 0.97
[[configs]]
lookahead_base = 0.93
[[configs]]
res_schedule = [[0.0, 20], [0.5, 28], [0.6, 32]]   # 28 px for the first 10% of the high-res phase
[[configs]]
res_schedule = [[0.0, 20], [0.45, 28], [0.6, 32]]
