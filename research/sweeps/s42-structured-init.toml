# Structured (unlearned) initialisation, the rule-compliant stand-in for build-time pre-training
# (synthetic pre-training is banned: RULES.md section 3 and the reset contract). Arms: orthogonal,
# 2-D DCT filter bank and deterministic ZerO-style Hadamard init for the non-identity conv rows
# (each stage's widening conv1), and SkipInit residual gates starting at 0 / 0.25. Current
# submission base, 20 seeds, both GPUs.
name = "s42-structured-init"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [4500, 4501, 4502, 4503, 4504, 4505, 4506, 4507, 4508, 4509,
         4510, 4511, 4512, 4513, 4514, 4515, 4516, 4517, 4518, 4519]
devices = [0, 1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
epochs = 8.0

[[configs]]                                   # control (= submission)
[[configs]]
conv_init = "orthogonal"
[[configs]]
conv_init = "dct"
[[configs]]
conv_init = "zero"
[[configs]]
residual_gate_init = 0.0
[[configs]]
residual_gate_init = 0.25
[[configs]]
conv_init = "dct"
residual_gate_init = 0.0
