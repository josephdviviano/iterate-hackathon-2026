# Coverage pass (X-003): every untested strategy from the CIFAR-10 record lineage (airbench,
# airbench94_muon, hiverge, Fable/Fulcrum, hlb-CIFAR10, Page), the competitor, and novel
# alternatives, applied one at a time to the converged recipe at 8.25 epochs. 10 seeds.
name = "s21-coverage"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
compile = true
fused_sgd = true
epochs = 8.25

[[configs]]                     # control
[[configs]]
activation = "silu"             # hiverge
[[configs]]
activation = "celu"             # Page
[[configs]]
whiten_kernel = 3               # Page 3x3 whitening
[[configs]]
head_pool = "maxmean"           # competitor, compile-safe form
[[configs]]
brightness = 0.14               # hiverge colour jitter
contrast = 0.13
[[configs]]
mixup_alpha = 0.2               # mixup, first half only
mixup_until = 0.5
[[configs]]
cutout = 8                      # airbench96 / Page
[[configs]]
flip = "random"                 # ablate alternating flip
[[configs]]
lookahead_flush = true          # competitor C9
[[configs]]
bn_recal_batches = 8            # novel: re-estimate BN stats for final weights
[[configs]]
weight_decay = 0.00765          # wd x0.5
[[configs]]
weight_decay = 0.0306           # wd x2
[[configs]]
momentum = 0.9
[[configs]]
momentum = 0.8
[[configs]]
bn_momentum = 0.8
[[configs]]
whiten_bias_epochs = 0.2        # hiverge
[[configs]]
whiten_samples = 960            # hiverge (cheaper prepare)
[[configs]]
lookahead = false               # retest without lookahead at the converged recipe
