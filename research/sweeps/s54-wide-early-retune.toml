# Round 4 on the D-012 base: extra width only in the cheap 20 px phase (transplanted to the
# submission widths at the switch; S36b gave +0.15 pp on the old base) and re-tuning of label
# smoothing, momentum and batch size for the new structure. 20 seeds, both GPUs.
name = "s54-wide-early-retune"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [5700, 5701, 5702, 5703, 5704, 5705, 5706, 5707, 5708, 5709,
         5710, 5711, 5712, 5713, 5714, 5715, 5716, 5717, 5718, 5719]
devices = [0, 1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
stage_depths = [3, 2, 3]
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
epochs = 8.5

[[configs]]                                   # control (= submission)
[[configs]]
widths = [128, 384, 768]                      # wide stage 3 at 20 px, 640 after the switch
switch_widths = [128, 384, 640]
[[configs]]
widths = [128, 448, 640]                      # wide stage 2 at 20 px
switch_widths = [128, 384, 640]
[[configs]]
widths = [160, 448, 768]                      # all stages wide at 20 px
switch_widths = [128, 384, 640]
[[configs]]
label_smoothing = 0.1
[[configs]]
label_smoothing = 0.3
[[configs]]
momentum = 0.8
[[configs]]
momentum = 0.9
[[configs]]
batch_size = 768
