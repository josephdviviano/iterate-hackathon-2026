# Last-stage width x epochs frontier on the current recipe (X-005): S36's narrow-throughout
# controls lost 0.40/0.65 pp for 7.2/9.9% less local time, cheaper than the ~1 pp per 12%
# exchange rate, so a narrower last stage with more epochs may reach 75.2% sooner. 20 seeds.
name = "s38-width-frontier"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [3900, 3901, 3902, 3903, 3904, 3905, 3906, 3907, 3908, 3909, 3910, 3911, 3912, 3913, 3914, 3915, 3916, 3917, 3918, 3919]
devices = [1]
slots_per_device = 1

[base]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true

[[configs]]
widths = [128, 384, 640]
epochs = 8.25
[[configs]]
widths = [128, 384, 512]
epochs = 8.75
[[configs]]
widths = [128, 384, 512]
epochs = 9.25
[[configs]]
widths = [128, 384, 448]
epochs = 9.0
[[configs]]
widths = [128, 384, 448]
epochs = 9.5
[[configs]]
widths = [128, 320, 512]
epochs = 9.0
