# Local paired timing of the two S47 finalists against the submission: control, depth-2 stage 2 at
# 8.25 epochs, and the freeze + depth stack at 8.5 epochs; GPU 0 in order (a), GPU 1 reversed (b).
name = "s48b-final-timing"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [5210, 5211, 5212, 5213, 5214, 5215, 5216, 5217, 5218, 5219]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
compile_mode = "max-autotune"
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
epochs = 7.75

[[configs]]                                   # stack at 8.5
stage_depths = [3, 2, 3]
epochs = 8.5
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
[[configs]]                                   # depth-2 stage 2 at 8.25
stage_depths = [3, 2, 3]
epochs = 8.25
[[configs]]                                   # control (= submission)
