# Same-GPU paired timing (GPU 1, which hosts no other services) of the S71 arms, max-autotune;
# block a in order then block b reversed (ABBA), 10 seeds each.
name = "s72a-skip-timing"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [7600, 7601, 7602, 7603, 7604, 7605, 7606, 7607, 7608, 7609]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
stage_depths = [3, 2, 3]
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
trim_tail = true
label_smoothing = 0.4
epochs = 8.25
compile_mode = "max-autotune"

[[configs]]                                   # control (= submission)
[[configs]]
stage_skips = [false, true, false]
[[configs]]
translate_low = 1
[[configs]]
stage_skips = [false, true, false]
translate_low = 1
