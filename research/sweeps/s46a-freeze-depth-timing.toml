# Local paired timing of the S44 survivors (replaces Modal M9 per the user's instruction): the same
# six arms on one GPU each, in opposite order on GPU 0 (a) and GPU 1 (b); compare arms within a
# GPU. max-autotune as submitted; local Blackwell times are a proxy for relative A100 savings.
name = "s46a-freeze-depth-timing"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [5000, 5001, 5002, 5003, 5004, 5005, 5006, 5007, 5008, 5009]
devices = [0]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
whiten_grad_off = true
bias_scaler = 16.0
conv_init = "dct"
epochs = 7.75
compile_mode = "max-autotune"

[[configs]]                                   # control (= submission)
[[configs]]
stage1_cooldown = [0.6, 0.8]                  # cooldown + exact stage-1 freeze from 80%
freeze_schedule = [[0.8, 1]]
[[configs]]
stage1_cooldown = [0.55, 0.75]                # freeze from 75%
freeze_schedule = [[0.75, 1]]
[[configs]]
stage_depths = [2, 3, 3]                      # depth-2 stage 1, +0.25 epoch
epochs = 8.0
[[configs]]
stage_depths = [3, 2, 3]                      # depth-2 stage 2, +0.5 epoch
epochs = 8.25
[[configs]]                                   # freeze 80% + depth-2 stage 2
stage1_cooldown = [0.6, 0.8]
freeze_schedule = [[0.8, 1]]
stage_depths = [3, 2, 3]
epochs = 8.25
