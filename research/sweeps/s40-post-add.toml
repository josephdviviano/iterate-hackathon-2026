# Teammates' (hypothesis-branch) residual placement GELU(BN(conv3(y)) + x) vs our
# x + GELU(BN(conv3(y))), on the current submission base and on the bias-scaler-16 base. 20 seeds.
name = "s40-post-add"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [4200, 4201, 4202, 4203, 4204, 4205, 4206, 4207, 4208, 4209,
         4210, 4211, 4212, 4213, 4214, 4215, 4216, 4217, 4218, 4219]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
epochs = 8.25
whiten_grad_off = true

[[configs]]                                   # control
[[configs]]
post_add_activation = true
[[configs]]
bias_scaler = 16.0
[[configs]]
bias_scaler = 16.0
post_add_activation = true
