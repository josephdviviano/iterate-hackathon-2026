# Fresh-seed confirmation of the S30 candidates (X-005): warmup-stable-decay schedule
# (+0.24 pp at decay start 0.6) and class-balanced batch order (+0.15 pp), 20 fresh seeds.
name = "s33-wsd-balanced"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [3300, 3301, 3302, 3303, 3304, 3305, 3306, 3307, 3308, 3309,
         3310, 3311, 3312, 3313, 3314, 3315, 3316, 3317, 3318, 3319]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
global_pool = "flatmax"
compile = true
fused_sgd = true
epochs = 8.25

[[configs]]                                   # control
[[configs]]
lr_shape = "wsd"
lr_decay_start = 0.5
[[configs]]
lr_shape = "wsd"
lr_decay_start = 0.6
[[configs]]
lr_shape = "wsd"
lr_decay_start = 0.7
[[configs]]
order = "balanced"
[[configs]]
lr_shape = "wsd"
lr_decay_start = 0.6
order = "balanced"
