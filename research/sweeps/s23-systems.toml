# Coverage (X-003): execution levers from the CIFAR-10 records, timed on GPU 1 (local proxy):
# compile modes (CUDA graphs), Fable's flatten-max global pool, and resizing inside the
# compiled forward. Accuracy should be unchanged; 5 seeds.
name = "s23-systems"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [1200, 1201, 1202, 1203, 1204]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
compile = true
fused_sgd = true
epochs = 8.25

[[configs]]
compile_mode = "default"
[[configs]]
compile_mode = "reduce-overhead"
[[configs]]
compile_mode = "max-autotune"
[[configs]]
global_pool = "flatmax"
[[configs]]
resize_in_model = true
[[configs]]
global_pool = "flatmax"
resize_in_model = true
