# Hill climb step 12 (X-002): S9 shows last-stage width is the efficient capacity lever
# (128/384/640 crosses 75.3% below 9 epochs). Push the last stage wider and trade earlier
# stages for it, at 8 and 9 epochs against an in-sweep control.
name = "s12-last-stage"
python = ".venv-blackwell/bin/python"
seeds = [0, 1, 2, 3, 4]
devices = [1]
slots_per_device = 1

[base]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]

[[grid]]
widths = [[128, 384, 512], [128, 384, 640], [128, 384, 768], [128, 320, 768], [128, 384, 1024]]
epochs = [8, 9]
