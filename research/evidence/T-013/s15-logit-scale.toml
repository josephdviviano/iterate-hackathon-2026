# Hill climb step 15 (X-002): logit scale. Competitor evidence (codex c7-pooling-confirm,
# 10 fresh seeds) shows a 1.5x head gain adds 0.2-0.4 pp at 9-10 epochs at zero cost; our
# scaling_factor (1/9) was never tuned. Compiled D-005 base, 10 fresh seeds.
name = "s15-logit-scale"
python = ".venv-blackwell/bin/python"
seeds = [300, 301, 302, 303, 304, 305, 306, 307, 308, 309]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
compile = true
fused_sgd = true

[[grid]]
epochs = [8.5, 9.0]
scaling_factor = [0.1111111111111111, 0.16666666666666666, 0.2222222222222222]
