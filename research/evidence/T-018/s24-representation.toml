# Representation alternatives (X-004): progressive deepening, hierarchical (superclass) label
# loss [rule-gated], RepVGG-style train-time 1x1 branches, alternative losses, and a ConvMixer
# family, each against the converged recipe at 8.25 epochs. 10 seeds.
name = "s24-representation"
submission = "research/lab_recipe"
python = ".venv-blackwell/bin/python"
seeds = [1300, 1301, 1302, 1303, 1304, 1305, 1306, 1307, 1308, 1309]
devices = [1]
slots_per_device = 1

[base]
widths = [128, 384, 640]
block_depth = 3
translate = 2
res_schedule = [[0.0, 20], [0.5, 32]]
scaling_factor = 0.16666666666666666
compile = true
fused_sgd = true
epochs = 8.25

[[configs]]                         # control
[[configs]]
rep_branch = true                   # R3 RepVGG-style 1x1 branches
[[configs]]
residual_start = 0.3                # R1 progressive deepening
residual_ramp = 0.1
[[configs]]
residual_start = 0.5
residual_ramp = 0.1
[[configs]]
loss = "poly1"                      # R5
poly_eps = 1.0
[[configs]]
loss = "squentropy"                 # R5
[[configs]]
coarse_aux_weight = 0.3             # R2 hierarchical labels (rule-gated)
[[configs]]
coarse_aux_weight = 1.0
[[configs]]
arch = "convmixer"                  # R4 different architecture family
convmixer_dim = 512
convmixer_depth = 8
convmixer_kernel = 5
convmixer_patch = 2
