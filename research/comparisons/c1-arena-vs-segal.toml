# Same-host paired comparison on Modal A100 (official torch 2.4 stack): our submission (reference),
# our lab candidate stack, and the teammates' hypothesis-branch iterations I001 (SGD airbench96
# reproduction, 8.5 epochs), I029 (Muon, 16/24/32 px), I044 (Muon renorm cadence), I049 (tip:
# Muon, 16/20/32 px). 4 hosts x 2 alternating-order blocks x 5 seeds = 40 trials per arm.
#   .venv-modal/bin/modal run research/modal_a100.py::compare --spec research/comparisons/c1-arena-vs-segal.toml
#   .venv-blackwell/bin/python research/compare_report.py research/comparisons/c1-arena-vs-segal.toml
name = "c1-arena-vs-segal"
hosts = 4
blocks = 2
seeds = [4100, 4101, 4102, 4103, 4104, 4105, 4106, 4107, 4108, 4109, 4110, 4111, 4112, 4113, 4114, 4115, 4116, 4117, 4118, 4119, 4120, 4121, 4122, 4123, 4124, 4125, 4126, 4127, 4128, 4129, 4130, 4131, 4132, 4133, 4134, 4135, 4136, 4137, 4138, 4139]

[[arms]]
label = "segal"
submission = "submissions/team_segal"

[[arms]]
label = "segal-candidate"
submission = "research/lab_recipe"
params = { widths = [128, 384, 640], block_depth = 3, translate = 2, res_schedule = [[0.0, 20], [0.5, 32]], scaling_factor = 0.16666666666666666, global_pool = "flatmax", compile = true, compile_mode = "max-autotune", fused_sgd = true, epochs = 8.25, whiten_grad_off = true, bias_scaler = 16.0, lr_shape = "wsd", lr_decay_start = 0.6, order = "balanced" }

