observation: 'S56 (20 seeds 5900-5919, D-012 base, control 75.12% at 4.33 s on GPU 1): stage-3 residual
  conv as 1x1 at 9.0 epochs 75.27% (4.39 s, GPU 0); stage-3 conv2 + residual as 1x1 at 9.5 / 8.5 epochs
  74.47 / 74.02%; the same with a ceil-mode 4x4 terminal grid at 9.5 epochs 74.49%; with width 768 at
  9.0 epochs 74.56%; stage 1 width 96 at 9.5 epochs 75.35% (4.57 s, GPU 0); centre-tap-only stage-3 square
  convs at 20 px, 8.75 epochs, 75.00% (4.33 s, GPU 1).'
interpretation: Stage 3's 3x3 conv2 carries real spatial capacity on the 3x3 terminal grid (1x1 costs
  about 1 pp at equal epochs), but its residual conv works as 1x1 (+0.15 pp at about matched time). A
  thinner stage 1 at more epochs may sit on a better frontier (+0.23 pp). Centre-tap pruning at 20 px
  loses at equal time.
decision_implication: Confirm the 1x1 stage-3 residual and stage-1 width 96 (and their combination) with
  40 fresh seeds and same-GPU paired timing (S59); reject the other topology arms.
