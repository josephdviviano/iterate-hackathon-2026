importance: material
observation: 'P1 (5 seeds per cell, single-view, dev stack): the airbench94 shape plateaus at 71.5% (1x)
  and 74.0% (1.5x) by 24 epochs; 2x crosses 75.3% at an interpolated 13.7 epochs (12.0 s local proxy);
  the airbench96 shape (128/384/512, three convs per block with a residual, translate 4) reaches 75.37%
  at 10 epochs (9.3 s) and 76.9% at 24.'
interpretation: 'Single-view 75% on CIFAR-100 is capacity-bound: extra epochs barely help narrow nets,
  while width and depth move accuracy several points. H2 (airbench tricks reach the target within 20 epochs)
  and H3 (minimum-time point at airbench96-class capacity) are supported; the best cell lies at the grid
  edge, so the optimum may sit below 10 epochs.'
decision_implication: 'Climb from the airbench96 shape: probe fewer than 10 epochs and nearby depth-3
  shapes before optimiser and resolution levers.'
