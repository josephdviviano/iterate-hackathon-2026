observation: 'S36b (20 seeds 3600-3619, after fixing the momentum-buffer memory format; control 75.14%
  at 5.34 s local): narrowing at the 20->32 px switch to 128/384/512 (Taylor saliency) 74.88% at 5.09
  s; to 448: Taylor 74.59%, random 74.62%, weight norm 74.58% (4.95-5.18 s); to 128/320/512 74.55% at
  4.70 s; training 128/384/768 in the 20 px phase then 640: 75.29% at 5.41 s. S36 narrow-throughout controls:
  512 -0.40 pp at -7.2%, 448 -0.65 pp at -9.9%.'
interpretation: 'Gradient saliency adds nothing: random channel selection matches Taylor and weight-norm
  selection, so the transplant works by keeping width early, not by sniffing important channels. Narrowing
  trades about 0.05-0.06 pp per 1% local time, at the exchange rate (about 0.054), so no net gain. The
  reverse, extra width only in the cheap 20 px phase (768 then 640), gains +0.15 pp for about +1.4% local
  time, which is favourable if the time holds on A100.'
decision_implication: Reject saliency narrowing; carry wide-early (768 -> 640) as a candidate for paired
  A100 timing and stacking with the BN-bias scaler.
