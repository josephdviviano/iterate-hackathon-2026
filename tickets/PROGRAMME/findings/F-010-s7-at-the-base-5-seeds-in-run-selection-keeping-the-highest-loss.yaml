result_kind: negative
importance: material
observation: 'S7 at the base (5 seeds): in-run selection keeping the highest-loss 50% of each batch reaches
  only 64.5%, 66.2% and 68.1% at 10, 12 and 14 epochs (sd up to 1.9 pp); keeping 70% reaches 73.3% and
  74.1% at 10 and 12 epochs; the in-sweep control reaches 75.33% and 75.85%.'
interpretation: 'H13 is disconfirmed for short CIFAR-100 runs: training only on the hardest examples starves
  a 10-epoch, 100-class run of the easy examples it still needs, and the high variance suggests instability.
  airbench96_faster''s gain came from a 45-epoch CIFAR-10 regime.'
decision_implication: Reject in-run selection; do not spend more GPU time on selection variants unless
  the climb plateaus with long budgets.
