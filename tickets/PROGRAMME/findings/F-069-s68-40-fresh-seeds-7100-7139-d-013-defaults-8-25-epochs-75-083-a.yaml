observation: 'S68 (40 fresh seeds 7100-7139, D-013 defaults): 8.25 epochs 75.083% at 4.184 s local; 8.5
  epochs 75.296% at 4.409 s (+5.4%). Pooled fresh-seed accuracy at the 8.25-epoch defaults is now about
  75.15% over 217 seeds.'
interpretation: The 8.5-epoch fallback adds about +0.21 pp for about 5% time, restoring roughly the M8-era
  margin; at 8.25 epochs P(official 40-seed mean < 75%) is about 0.5% at the central offset and 3-4% under
  the worst measured offset.
decision_implication: 'Margin, not speed, is now binding: either confirm 8.25 epochs on an official-equivalent
  A100 run or move to an intermediate budget; a zero-cost accuracy lever would be the most valuable find.'
