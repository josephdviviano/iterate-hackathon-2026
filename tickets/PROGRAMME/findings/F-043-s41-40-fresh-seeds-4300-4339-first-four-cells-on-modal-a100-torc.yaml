  / 75.26 / 75.10% (SE 0.04); scaler 16 in the 20 px phase then 64: 8.0 / 7.75 epochs 75.17 / 75.00%.
  S39 (20 seeds): scaler 16/8/4/2 +0.30/+0.23/+0.07/-0.25 pp; 64->16 at the switch +0.08; 16->64 +0.37.'
interpretation: 'Scaler 16 is a robust +0.24 to +0.40 pp across five sweeps and both stacks; it buys 0.25
  epoch at matched accuracy (8.0 epochs: 75.26% vs 75.19% control), about -3% time. 7.75 epochs leaves
  only about 2.5 SE above 75%. The phase-switched variant does not replicate the S39 estimate.'
decision_implication: Adopt bias_scaler 16 and 8.0 epochs in the submission; re-qualify on A100 PCIe with
  40 fresh random seeds.
