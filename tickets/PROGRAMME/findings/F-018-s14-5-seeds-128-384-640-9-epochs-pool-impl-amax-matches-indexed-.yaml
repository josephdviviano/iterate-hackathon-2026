observation: 'S14 (5 seeds, 128/384/640, 9 epochs): pool_impl amax matches indexed max-pool accuracy in
  eager mode (75.47% vs 75.52%) but is 62% slower (10.71 s vs 6.62 s); compiled amax produced non-finite
  logits and failed; compiled indexed max-pool reaches 75.33% in 5.81 s. Competitor run codex c7 also
  failed with non-finite logits when its max+mean head (amax) was compiled.'
interpretation: The reshape-plus-amax pooling is exact on CPU but eager CUDA reductions over channels_last
  tensors are slow, and compiled amax diverges on this stack, plausibly an Inductor lowering problem at
  training shapes. The pooling profile cost cannot be removed this way.
decision_implication: Keep indexed max-pool (pool_impl torch); do not compile amax-based pooling or heads.
