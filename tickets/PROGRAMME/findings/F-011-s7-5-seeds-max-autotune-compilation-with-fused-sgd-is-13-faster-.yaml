observation: 'S7 (5 seeds): max-autotune compilation with fused SGD is 13% faster per epoch (5.81 s vs
  6.71 s at 10 epochs) but 0.28 pp and 0.36 pp lower at 10 and 12 epochs (75.05%, 75.49% vs 75.33%, 75.85%);
  lr 9.2 lowers accuracy (74.92%, 75.44%) and lr 14.4 ties the default (75.36%, 75.56%). The compile arm
  still used dynamic-shape recompilation (fixed afterwards with dynamic=False).'
interpretation: 'The compiled-plus-fused arms are lower in both S6 and S7 at matched epochs, so the deficit
  looks systematic rather than noise; its source (fused SGD versus compiled numerics) is unresolved. H15
  is rejected: the default learning rate is already near-optimal for the base.'
decision_implication: Keep lr 11.5; resolve the compile deficit in S8 (10 seeds, compile and fused separated,
  dynamic=False) before adopting compilation for timing.
