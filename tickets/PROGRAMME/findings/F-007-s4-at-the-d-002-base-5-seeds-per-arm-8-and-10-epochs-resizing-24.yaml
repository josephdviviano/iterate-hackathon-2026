observation: 'S4 at the D-002 base (5 seeds per arm, 8 and 10 epochs): resizing 24 then 32 px at half-way
  reaches 75.3% at 9.66 epochs and 7.05 s proxy versus 8.25 s for control (-15%); translate 1 (8.28 s)
  and label smoothing 0.1 (8.30 s) tie with control; translate 0 (-1.3 pp), lookahead off (-0.8 to -0.9
  pp), batch 2048 (-0.6 pp) and Muon at batch 1024 or 2000 (-0.8 to -1.4 pp, about 10% slower per step)
  lose; batch 1536 is slightly slower (8.47 s); 128/512/768 at translate 2 reaches 76.42% at 8 epochs.
  The control arms reproduce S3 exactly (74.858%, 75.854%).'
interpretation: H5 is supported (resolution); H4 is disconfirmed for Muon as ported with airbench94_muon
  hyperparameters; H8 is disconfirmed; H9 is partly supported (light translation helps, label smoothing
  is flat, lookahead is necessary). Identical control means across sweeps confirm that results reproduce
  bit-for-bit for fixed code and seeds on this stack.
decision_implication: Adopt progressive resizing and tune its schedule; keep SGD with lookahead, batch
  1024, label smoothing 0.2, translate 2; retest the wide shape with resizing (S5).
