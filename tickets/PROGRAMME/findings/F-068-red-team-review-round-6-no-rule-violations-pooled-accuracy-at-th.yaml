observation: 'Red-team review (round 6): no rule violations; pooled accuracy at the D-013 defaults over
  177 fresh seeds is 75.160% (SD 0.234); local-vs-A100 offset evidence pools to about 0 +/- 0.02 pp (M3/S29
  -0.043, M8 +0.01, M7 vs S43 +0.06); P(official 40-seed mean < 75%) about 0.2% at the central offset
  and up to about 3% if the M3 offset applies; winner''s curse shrinks D-012 to about -0.05 pp and D-013
  to about +0.00 pp; estimated A100 PCIe time about 4.73 +/- 0.2 s. Checks run: on torch 2.4.0 (CPU, aot_eager)
  the frozen path compiles 3 graphs over 3 repetitions of all phases with no per-call recompiles; a cold
  build with fresh compiler caches pinned to 4 cores takes 173 s (limit 600 s) and the trial completes
  (75.35%, 3.97 s local).'
interpretation: The entry very probably qualifies and is about 14% faster than M8, but every change since
  M8 has only run on the dev stack; the margin is narrower than earlier stated (about 75.16%) and the
  one essential remaining check is an official-equivalent run on an A100 PCIe with the pinned stack.
decision_implication: Keep D-013; measure the 8.5-epoch fallback locally (S68); recommend one official-equivalent
  A100 PCIe run before submission (requires the user's approval to use Modal).
