observation: 'S22 (10 seeds): the hiverge CIFAR-10 record''s optimiser stack (Muon with hiverge NS coefficients,
  renormalisation every 2 to 17 steps, decoupled weight decay, lr 0.205, momentum 0.655 and 0.825, head_norm,
  label smoothing 0.09, whitening bias 0.2 epochs) on the converged architecture reaches 73.07% / 73.77%
  at 8.25 / 10 epochs with batch 1024, 72.49% / 73.56% with batch 1536, and 72.01% / 72.54% with Muon
  lr 0.15 / 0.30, versus 75.33% for the SGD control at 8.25 epochs.'
interpretation: 'Muon is rejected for single-view CIFAR-100 in both ports (airbench94_muon, F-007 and
  F-012; hiverge here): it trails SGD with lookahead by 1.5-3.3 pp at every batch size, budget and lr
  tried. The hiverge stack was tuned for 10-way, TTA-scored, 64/256/256 training.'
decision_implication: Close the optimiser dimension on SGD with lookahead.
