observation: 'S31 (20 seeds 3000-3019, 8.25 epochs, control 75.15%, SE about 0.05 pp per arm): online
  LS 0.2 -0.10; PS-KD 0.3 +0.02, 0.6 -0.45; LS anneal to 0 -0.21; 1x1 head expansion 1024 -1.19; overlapping
  odd-map pools +0.04 (+4% time); ceil-mode stage 3 +0.23 (+5.5% time); cosine head s=20 -2.91; class-mean
  head init -0.17; fp32 master weights +0.03; clean tail 0.25/1.25 epochs +0.02/+0.02; conv wd x0.5 -0.74;
  head wd x0.5 +0.01; head lr x2/x0.5 -0.39/-0.18; bias scaler 32/128 +0.20/-0.28; init gain 0.5/0.7 +0.11/+0.08;
  gain 0.6 with shorter warm-up -0.01; momentum x0.5 at the switch +0.08; 20/32 blend +0.08; ETF head
  scale 1/6 and 1/3 -0.96/-0.51; LSE pool tau 0.5/1.0 +0.00/+0.17 (pp vs control).'
interpretation: 'Soft-target, head-geometry and head-capacity levers do not help; fp16 update rounding
  is not limiting (master weights null); the clean tail is null. The weight-decay sensitivity lives in
  the scale-invariant convs (effective lr), not the head. Ceil-mode stage 3 gains less than its time cost.
  Three arms sit near the best-of-27 noise ceiling (about +0.15 pp): bias scaler 32, LSE pool tau 1.0,
  init gain 0.5.'
decision_implication: Reject the rest; confirm bias scaler 32/16, LSE pool tau 1.0/2.0, init gain 0.5
  and their stack on 20 fresh seeds (S37).
