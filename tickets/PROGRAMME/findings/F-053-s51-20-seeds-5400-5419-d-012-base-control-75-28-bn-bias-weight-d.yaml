observation: 'S51 (20 seeds 5400-5419, D-012 base, control 75.28%): BN-bias weight-decay multiplier 0.25
  / 4 / 0: 74.96 / 75.19 / 74.84%; scaler 64 with bias decay x4: 75.16%; stage-1 cooldown+freeze 0.65-0.75
  / 0.6-0.7 / 0.6-0.7 with stage-1 lr x1.3: 75.13 / 75.04 / 75.02%; identity + DCT perturbation of the
  square convs beta 0.25 / 0.5: 75.13 / 75.12%; identity + random perturbation beta 0.5: 75.25%; head-feature
  centring 74.41%; whitening eps 5e-3 / 5e-2: 75.23 / 75.19%.'
interpretation: 'No learning-per-step lever improves the D-012 base. The bias decay arms separate size
  from noise: matching scaler 64''s equilibrium bias size with less noise loses 0.32 pp while matching
  scaler 16''s size with more noise loses only 0.12 pp, so the scaler-16 gain works mainly by keeping
  BN biases small; stronger decay adds nothing. Earlier stage-1 freezes lose 0.15-0.24 pp for 1.7-3.4%
  time (worse than the exchange rate). Square-conv perturbations, head centring and whitening eps are
  null or harmful.'
decision_implication: Reject all S51 arms; keep D-012.
