observation: 'm3 (Modal, torch 2.4.0, 40 fresh seeds 1700-1739, current submission): 75.24% at 8.25 epochs
  (A100 SXM4, 5.24 s), 75.24% at 8.5 (SXM4, 5.73 s), 75.43% at 8.75 (A100 80GB PCIe, 6.45 s); untimed
  build 121-191 s; evaluation about 0.1 s. Its local twin s29 on the same seeds gives 75.27%, 75.31% and
  75.46%. Paired A100 minus local: -0.03, -0.07 and -0.03 pp; pooled -0.043 pp (SE 0.035, n=120).'
interpretation: Accuracy transfers between the dev stack and the pinned A100 stack to within 0.1 pp (R-007
  satisfied); m1's -0.16 pp at 10 seeds was noise. The 8.25-epoch budget meets the 75.2% development criterion
  on the target stack. SXM hosts differ by up to 9% in time, so official-equivalent timing needs a PCIe
  host.
decision_implication: Keep 8.25 epochs (D-007 confirmed); run the official-equivalent 40-seed check on
  an A100 80GB PCIe host (T-015).
