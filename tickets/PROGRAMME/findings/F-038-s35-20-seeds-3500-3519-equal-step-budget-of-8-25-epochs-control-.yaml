effect: observes
interpretation_paths:
- kind: mechanism
  disposition: supported
  rationale: 'compute-starved underfitting: each image is seen about 8 times and the model has not fit
    even the hard tail, so removing examples removes signal'
  discriminating_test: none
- kind: implementation
  disposition: rejected
  rationale: stale scores could mis-rank, but the hard-drop arms fail monotonically with fraction, as
    signal loss predicts
  discriminating_test: none
