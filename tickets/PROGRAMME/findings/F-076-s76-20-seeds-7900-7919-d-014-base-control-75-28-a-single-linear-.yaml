observation: 'S76 (20 seeds 7900-7919, D-014 base, control 75.28%): a single linear head on [global max
  of stage 3, global max of stage 2] gives 73.77% (seed SD 0.96 pp, unstable) at logit scale 1/6 and 74.75%
  at 1/7.'
interpretation: Feeding stage-2 features to the head destabilises training (the extra 384 max-pooled features
  enlarge and skew the logits) and loses accuracy even at a reduced scale, as the separate multi-exit
  head did (F-033).
decision_implication: Reject the multi-scale head.
