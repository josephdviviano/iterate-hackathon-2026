observation: 'S44 (20 seeds 4700-4719, bias scaler 16 at 8.0 epochs base, control 75.24% at 5.20 s local):
  stage-1 lr cooldown 0.6->0.8 75.19% (5.04 s); the same cooldown plus freezing stage 1 from 80% 75.19%
  (identical) at 4.72 s; cooldown 0.5->0.7 + freeze from 70% 74.99% (4.72 s); 18 px first phase 75.15%;
  depth-2 stage 1 at 8.25 epochs 75.07% (4.84 s); depth-2 stage 2 at 8.5 epochs 75.11% (4.85 s). Arms
  ran on two GPUs, so local times are indicative.'
interpretation: Cooling stage 1's lr to zero by 80% costs about 0.05 pp, and the freeze that then skips
  stage 1's backward is exact (identical accuracy), saving an estimated 6-9% because it removes backward
  work in the expensive 32 px tail. Freezing from 70% costs 0.25 pp. Depth-2 stage cuts trade about 0.02
  pp per 1% time, below the 0.054 exchange rate. The 18 px phase saves nothing measurable and costs accuracy.
decision_implication: Confirm freeze (80%, 75%), depth cuts and the freeze + depth stack on 40 fresh seeds
  on the current base (S45) and time them same-host on A100 (M9); reject the 18 px phase.
