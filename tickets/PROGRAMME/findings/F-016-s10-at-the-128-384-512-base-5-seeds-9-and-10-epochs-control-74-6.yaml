observation: 'S10 at the 128/384/512 base (5 seeds, 9 and 10 epochs): control 74.68% and 75.33%; lr peak
  0.1 or 0.35, final lr 0 or 0.15, and whitening-bias epochs 1 or 6 all fall within 0.3 pp of control
  (best: whitening-bias 6 epochs, 6.61 s vs 6.69 s to target); a short final 32 px phase (20/28/32) and
  a 16 px start lose 1.2-1.8 pp.'
interpretation: 'Schedule and optimiser hyperparameters are at a plateau for this base: the airbench defaults
  transfer. Resolution schedules that shorten the final full-resolution phase lose accuracy, consistent
  with F-009.'
decision_implication: Freeze schedule hyperparameters at their defaults; stop hyperparameter climbing
  and converge on epochs and execution.
