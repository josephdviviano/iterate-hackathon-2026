observation: 'S19 (20 fresh seeds 700-719): the 50% switch at 8.25 epochs gives 75.22% in 5.38 s; a 45%
  switch at 8.0 epochs gives 75.22% in 5.43 s; a 40% switch gives 75.09% at 7.5 epochs (5.27 s) and 75.36%
  at 8.0 epochs (5.67 s), interpolating to about 5.46 s at 75.22%.'
interpretation: 'At matched accuracy the 50% switch is fastest; earlier switches buy accuracy at a time
  cost that is no better than adding epochs. With S10, S15 and S17 this exhausts the accessible levers:
  the climb has converged at the D-005 to D-007 recipe. Pooled over S18 and S19, 60 fresh seeds at 8.25
  epochs average about 75.25%.'
decision_implication: Declare X-002 saturated, close T-013, and converge the recipe into submission defaults
  (T-014); remaining uncertainty is cross-stack transfer and A100 timing (T-004, T-015).
