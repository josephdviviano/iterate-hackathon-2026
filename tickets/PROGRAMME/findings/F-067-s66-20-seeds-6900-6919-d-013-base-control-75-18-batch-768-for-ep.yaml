observation: 'S66 (20 seeds 6900-6919, D-013 base, control 75.18%): batch 768 for epochs 0-3 then 1024
  at 8.25 / 8.0 epochs (schedules re-mapped to keep the switch and freeze at the same epochs): 75.09 /
  74.92%; batch 512 then 1024 at 8.25 epochs: 74.62%; none faster locally. S67 (40 fresh seeds 7000-7039,
  control 75.11%): momentum 0.8 + lr 13: 75.17%; plus wide-early stage 3 (768 -> 640): 75.18% (about +4%
  local time); the full stack at 8.0 epochs: 74.91%.'
interpretation: 'A batch-size ramp hurts at matched epochs (smaller early batches disturb the warm-up
  the constant-batch schedule is tuned for) and saves no time. The sub-threshold positives do not add
  up: the stack gains only +0.07 pp, too little to fund a quarter-epoch cut.'
decision_implication: Reject both; the D-013 submission stays.
