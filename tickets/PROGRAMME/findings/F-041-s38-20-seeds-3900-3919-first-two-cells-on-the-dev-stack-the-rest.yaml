observation: 'S38 (20 seeds 3900-3919; first two cells on the dev stack, the rest on Modal A100, torch
  2.4): 128/384/640 at 8.25 epochs 75.16%; 128/384/512 at 8.75 / 9.25 epochs 74.97 / 75.26%; 128/384/448
  at 9.0 / 9.5 epochs 74.79 / 75.07%; 128/320/512 at 9.0 epochs 74.84%.'
interpretation: 'A narrower last stage needs about one extra epoch to match 640 at 8.25 (512 reaches 75.26%
  only at 9.25 epochs, +12% steps at about 7% cheaper steps, about +4% time), and 448 or 320/512 never
  catch up within the tested budgets. The width frontier has not moved: 640 at 8.25 epochs stays the efficient
  point.'
decision_implication: Keep widths 128/384/640; close the width-reallocation direction.
