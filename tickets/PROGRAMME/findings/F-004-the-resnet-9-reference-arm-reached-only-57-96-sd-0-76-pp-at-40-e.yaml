result_kind: negative
importance: contextual
observation: The ResNet-9 reference arm reached only 57.96% (sd 0.76 pp) at 40 epochs, versus the organisers'
  75.36% for a ResNet-9 baseline at the same budget.
interpretation: 'The arm reused airbench''s optimiser parametrisation (lr 11.5 per 1024, BN-bias lr x64,
  frozen-BN momentum) on a ReLU network with trainable BatchNorm, so the shortfall reflects mistuned hyperparameters,
  not the architecture. Retuning is not decision-bearing: ResNet-9 costs 113.8 TFLOP per epoch and needs
  about 40 epochs (organiser evidence), roughly 3.4x the FLOPs of the airbench96 shape at 10 epochs.'
decision_implication: Reject ResNet-9 as a base (H1) on FLOP grounds; do not spend GPU time retuning the
  arm.
