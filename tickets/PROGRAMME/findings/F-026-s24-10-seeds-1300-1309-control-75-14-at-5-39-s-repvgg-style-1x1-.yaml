observation: 'S24 (10 seeds 1300-1309; control 75.14% at 5.39 s): RepVGG-style 1x1 branches 75.19% at
  6.51 s; PolyLoss-1 75.10%; squentropy 74.77%; superclass auxiliary loss 75.14% (weight 0.3, +5% time)
  and 73.25% with sd 1.2 pp (weight 1.0); ConvMixer-512/8 (k5, patch 2) 25.6% in 19.9 s. Progressive deepening
  crashed in fused SGD and is rerun in S25.'
interpretation: 'R3, R4 and R5 are disconfirmed: train-time over-parameterisation buys nothing for its
  21% cost, alternative losses do not beat smoothed cross-entropy, and ConvMixer''s depthwise mixing neither
  learns in 8 epochs nor runs fast. R2 shows no gain at a mild weight and destabilises training at weight
  1.0, so the hierarchy route is rejected and its rule question is moot.'
decision_implication: Keep the airbench convnet, plain 3x3 convs and smoothed cross-entropy; finish R1
  in S25.
