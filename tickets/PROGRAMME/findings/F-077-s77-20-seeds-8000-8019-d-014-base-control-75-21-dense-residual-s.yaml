interpretation: The stage-2 skip works as a plain identity (branch weight flat from 0.5 to 2); adding
  the conv2 output into the residual sum doubles the signal and destabilises training; freezing stage
  2 still costs about as much accuracy as it saves time even with the skip.
decision_implication: Reject all three; D-014 unchanged.
