observation: 'M7a (Modal, NVIDIA A100 80GB PCIe 300 W, torch 2.4.0, 40 fresh random uint32 seeds, network
  blocked): updated submission defaults (whitening-bias autograd off, BN-bias scaler 16, 8.0 epochs) reach
  75.290% mean single-view accuracy (SD 0.256) at 5.640 s mean prepare+train (SD 0.029). M7b landed on
  an A100-SXM4 (400 W): 75.332% at 5.255 s. T-015 measured 6.027 s for the previous defaults on a different
  PCIe host.'
interpretation: The updated submission qualifies on the official card with a margin of about 7 SE (P(40-seed
  mean < 75%) negligible). Time is about 6% below the T-015 qualification, consistent with the paired
  -3% of the whitening change and the 3% step cut; the cross-host comparison carries 1.5-9% host variance.
decision_implication: The updated defaults are the current entry; any further adoption needs a fresh official-equivalent
  run.
