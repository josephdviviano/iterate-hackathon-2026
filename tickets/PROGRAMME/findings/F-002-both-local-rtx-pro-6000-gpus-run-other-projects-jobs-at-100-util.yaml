observation: Both local RTX PRO 6000 GPUs run other projects' jobs at 100% utilisation, 300 W power cap
  and 87-88 C; a compiled default run took 14.8-23.6 s on GPU 1 versus 8.0-9.0 s eager on GPU 0, with
  no recompilation logged.
interpretation: Local wall times reflect contention and power capping, not the recipe; exploration throughput
  depends on the other workloads.
decision_implication: Keep one slot per GPU, never compare local times, and take all timing from the A100
  (T-004).
