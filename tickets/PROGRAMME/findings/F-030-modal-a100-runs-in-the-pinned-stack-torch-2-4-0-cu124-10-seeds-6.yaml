observation: 'Modal A100 runs in the pinned stack (torch 2.4.0+cu124), 10 seeds 600-609, 8.25 epochs:
  on A100 80GB PCIe the converged recipe takes 6.169 s (m1) and 6.261 s (m2) per trial with default compile,
  6.173 s with reduce-overhead and 6.115 s with max-autotune (181 s untimed build); 128/384/512 takes
  5.76 s; prepare is 0.07 s; evaluation 0.10-0.12 s. Accuracy 75.15-75.20%. Paired with the local dev
  stack on the same seeds, A100 accuracy is -0.157 pp (SE 0.114).'
interpretation: On the judging GPU the recipe trains about 9.6x faster than the organisers' 59.3 s baseline
  before the flatten-max pool and CUDA graphs. Compile-mode gains match the local proxy (-1.4% / -2.3%).
  Identical configs differ by about 1.5% between PCIe hosts, so timing comparisons must be paired on one
  host. The cross-stack accuracy gap is not significant at 10 seeds but would erase most of the 8.25-epoch
  margin if real.
decision_implication: Measure the current submission at 8.25/8.5/8.75 epochs on A100 with 40 fresh seeds
  plus a local twin (m3, s29) before fixing the budget.
