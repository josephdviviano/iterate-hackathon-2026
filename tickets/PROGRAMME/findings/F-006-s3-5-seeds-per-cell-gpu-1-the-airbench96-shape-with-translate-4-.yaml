observation: 'S3 (5 seeds per cell, GPU 1): the airbench96 shape with translate 4 reaches 75.3% at 9.68
  epochs (9.02 s proxy); with translate 2 it reaches it at 8.89 epochs (8.28 s), +0.41 pp at 8 and +0.48
  pp at 10 epochs; 128/512/768 reaches it at 7.13 epochs but 9.43 s; 96/256/384 tops out at 73.9% by 10
  epochs.'
interpretation: 'H7 is supported through the budget and augmentation dimensions rather than a new shape:
  lighter translation helps short CIFAR-100 runs (an H9-style regularisation effect), and the wider 128/512/768
  shape saves epochs but not time. The 128/384/512 depth-3 shape remains the efficient capacity point.'
decision_implication: Climb levers at 128/384/512, three convs, translate 2, bracketing the target at
  8 and 10 epochs (S4); test translate 0-1 and the wider shape again at translate 2.
