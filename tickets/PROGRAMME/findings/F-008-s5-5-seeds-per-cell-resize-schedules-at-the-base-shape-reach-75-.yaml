observation: 'S5 (5 seeds per cell): resize schedules at the base shape reach 75.3% in 6.89 s (20 px then
  32 at half-way), 7.20 s (16/24/32), 7.32 s (24/32 at half-way; S4 estimate 7.05 s), 7.39 s (24/28/32);
  24 px for 70% never reaches 75.3% by 12 epochs; 128/512/768 reaches it in 8.56 s at full resolution
  and 7.34 s with 24/32 resizing.'
interpretation: 'Within the resizing family proxy time has plateaued: differences are within the about
  5% resolution of 5-seed cells (0.1 pp accuracy SE is about 0.4 epochs). Long low-resolution phases cost
  too much accuracy, and the wider shape does not beat the base once epochs are cheap.'
decision_implication: Fix the base at 20 px then 32 px at half-way, about 10.6 epochs; treat future gains
  under about 5% as noise unless confirmed with 10 or more seeds.
