result_kind: positive
importance: material
observation: 'S12 (5 seeds, eager proxy): time to 75.3% is 6.29 s for 128/384/640 (8.70 epochs), 6.45
  s for 128/320/768 (8.96), 6.52 s for 128/384/768 (8.36) and above 7.26 s for 128/384/1024; the 128/384/512
  control does not reach 75.3% by 9 epochs (74.68%).'
interpretation: 'Last-stage width is the efficient lever up to about 640 channels: it cuts epochs enough
  to more than pay for its cost, beyond which per-epoch cost dominates. This also restores margin that
  the S8 fresh-seed control lacked.'
decision_implication: Adopt 128/384/640 as the base (D-005) and fine-tune epochs near 8.5-9 with compiled
  timing and 10 seeds.
