observation: The default airbench94-equivalent recipe (64/256/256, 10 epochs, batch 1024, no TTA) reaches
  69.4-69.7% single-view CIFAR-100 accuracy on the dev stack (7 trials over eager and compiled runs);
  the smoke sweep gives 59.8% at 4 epochs and 43.1% at 2 epochs for the same width.
interpretation: The airbench94 shape is about 5.5 pp short of 75% at 10 epochs, versus 93.3% single-view
  on CIFAR-10 at the same budget; reaching 75.3% needs more epochs, more width, or both, so the P1 grid
  range (10-24 epochs, widths 1x-2x plus the airbench96 shape) is appropriately placed. The observation
  does not yet separate H2 from H3.
decision_implication: Launch P1 as specified; if no cell reaches 75.3% by 24 epochs, extend epochs or
  width before the regime decision.
