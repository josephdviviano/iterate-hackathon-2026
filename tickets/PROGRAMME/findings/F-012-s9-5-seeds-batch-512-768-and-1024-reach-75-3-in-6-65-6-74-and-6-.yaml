observation: 'S9 (5 seeds): batch 512, 768 and 1024 reach 75.3% in 6.65, 6.74 and 6.67 s; widths 128/384/640
  reach 75.42% at 9 epochs and 75.72% at 10 (time to target <= 6.50 s); 128/448/512 needs 7.50 s, 160/384/512
  and 96/384/512 do not reach 75.3% by 10 epochs; Muon with lookahead and the standard 1/9 head produced
  non-finite logits in all four arms (lr 0.12 and 0.24).'
interpretation: Batch size is flat. Capacity added to the last stage, which runs at 4x4 to 8x8 resolution,
  buys accuracy most cheaply; earlier-stage width does not. Muon without head normalisation diverges in
  fp16, so Muon is rejected for this programme (H4 rejected).
decision_implication: Climb last-stage width (S12); keep batch 1024 and SGD.
