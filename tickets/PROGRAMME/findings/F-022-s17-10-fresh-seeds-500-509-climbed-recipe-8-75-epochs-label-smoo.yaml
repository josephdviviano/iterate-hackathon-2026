observation: 'S17 (10 fresh seeds 500-509, climbed recipe, 8.75 epochs): label smoothing 0.1 / 0.2 / 0.3
  give 75.35% / 75.41% / 75.52% at equal time; switching to 32 px at 40% gives 75.84% in 6.19 s, at 60%
  gives 75.01% in 5.18 s, versus 75.41% in 5.69 s at 50%.'
interpretation: 'Label smoothing is flat around 0.2. The switch point trades accuracy for time: 60% lies
  on the same curve as trimming epochs (S18: 8.0 epochs 75.02% in 5.21 s), while 40% sits about 0.3 pp
  above that curve at equal time and may reach the D-007 level sooner.'
decision_implication: Keep label smoothing 0.2; test the 40-45% switch at 7.5-8 epochs before declaring
  convergence (S19).
