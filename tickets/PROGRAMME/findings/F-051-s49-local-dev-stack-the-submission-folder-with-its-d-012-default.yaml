observation: 'S49 (local dev stack, the submission folder with its D-012 defaults, 40 fresh random uint32
  seeds over GPUs 0 and 1): 75.129% (SD 0.243) and 75.180% (SD 0.279), pooled 75.154% (SE 0.041). With
  S47 (75.199%, 40 seeds) and S48 (75.13%, 20 seeds) the stack at 8.5 epochs averages about 75.17% over
  100 seeds.'
interpretation: The submission reproduces the lab result and clears 75% by about 3.8 SE on 40 seeds. Earlier
  A100 qualifications matched local means to within 0.03 pp (M7a vs S41, M8 vs S43), so the estimated
  risk that an official 40-seed mean falls below 75% is well under 1%, though thinner than at the previous
  defaults.
decision_implication: Keep D-012; an official-equivalent A100 PCIe run would confirm absolute time and
  margin if the user wants Modal used.
