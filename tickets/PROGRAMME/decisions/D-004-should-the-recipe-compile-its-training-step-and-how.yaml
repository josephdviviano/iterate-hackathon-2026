schema_version: '1.0'
decision_id: D-004
task_id: T-013
question: Should the recipe compile its training step, and how?
decision: Compile the training model in build with torch.compile(mode='default', dynamic=False) and use
  fused SGD; evaluation keeps the eager module.
rationale: About 12% lower time at unchanged accuracy over 10 fresh seeds; build cost stays far below
  the 600 s limit; dynamic=False keeps one specialised graph per resolution.
alternatives:
- 'Eager: rejected, 12% slower.'
- 'max-autotune (CUDA graphs): not yet re-measured with dynamic=False; S7 showed 13% with the dynamic-shape
  bug, so it stays a candidate for the A100.'
