task_id: T-013
question: Which S4 levers enter the climbing recipe?
decision: Adopt progressive resizing (24 px then 32 px); keep SGD with lookahead, batch 1024, label smoothing
  0.2 and translate 2.
rationale: Only resizing lowers proxy time beyond noise (-15%); other levers tie or lose accuracy at fixed
  epochs.
alternatives:
- 'Muon (as ported): rejected, -0.8 to -1.4 pp and slower steps.'
- 'Batch 1536/2048: rejected, slower to target.'
- 'Translate 1 / label smoothing 0.1: equivalent; keep defaults to limit changes.'
