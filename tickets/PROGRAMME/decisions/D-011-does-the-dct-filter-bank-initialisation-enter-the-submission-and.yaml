task_id: T-019
question: Does the DCT filter-bank initialisation enter the submission, and at what budget?
decision: Adopt the DCT init for the non-identity rows of each stage's widening conv and cut the budget
  to 7.75 epochs (372 steps).
rationale: Replicated in S42 and S43 (+0.11 to +0.17 pp); at 7.75 epochs it matches the 8.0-epoch control
  on 40 fresh seeds, a 3% step cut at no time cost; bit-identical to the lab on CPU.
alternatives:
- Keep 8.0 epochs and bank the accuracy margin (+0.11 pp)
- 7.5 epochs (untested; margin would likely fall below 75%)
