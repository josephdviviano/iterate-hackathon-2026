worksets:
- workset_id: enablement
  title: Exploration enablement
  purpose: Provide the development stack, the parametrised recipe substrate and the sweep tooling that
    every probe depends on.
  decision_boundary: Can the team run the exploration grid at scale and trust its outputs?
  exit_conditions:
  - A multi-GPU sweep through the official harness completes and resumes after interruption.
  - The recipe substrate passes the harness smoke test and the repeat-seed reset test.
  prerequisite_workset_ids: []
  exit_requirement_ids:
  - R-006
  sequence: 1
- workset_id: calibration
  title: A100 PCIe calibration
  purpose: Measure per-epoch time on the official hardware and check that local accuracy evidence transfers
    to the pinned stack.
  decision_boundary: Which time model and which accuracy correction apply to frontier decisions?
  exit_conditions:
  - Per-epoch A100 PCIe time is known for every frontier candidate.
  - Cross-stack accuracy agreement is established or quantified.
  prerequisite_workset_ids:
  - enablement
  exit_requirement_ids:
  - R-005
  - R-007
  sequence: 3
- workset_id: frontier
  title: Width by epochs frontier
  purpose: Measure where single-view accuracy crosses 75.3% across widths, depths and epochs.
  decision_boundary: Is the competition capacity-bound or throughput-bound, and which base regime wins?
  exit_conditions:
  - The frontier table exists with at least five seeds per cell.
  - A regime decision record exists.
  prerequisite_workset_ids:
  - enablement
  exit_requirement_ids:
  - R-003
  sequence: 2
- workset_id: addons
  title: Add-on levers at the selected base
  purpose: Test optimiser, resolution, example-selection and regularisation levers at matched accuracy
    on the selected base.
  decision_boundary: Which levers enter the final recipe?
  exit_conditions:
  - Every tested lever has a matched-accuracy comparison and a disposition.
  prerequisite_workset_ids:
  - frontier
  - calibration
  exit_requirement_ids:
  - R-004
  sequence: 4
- workset_id: assurance
  title: Convergence and assurance
  purpose: Converge the final recipe into a lean submission and challenge it under official-equivalent
    conditions and a compliance review.
  decision_boundary: Is the exact candidate qualifying, compliant and ready to submit?
  exit_conditions:
  - The official-equivalent 40-seed run qualifies with margin.
  - The compliance review finds no violation.
  prerequisite_workset_ids:
  - addons
  exit_requirement_ids:
  - R-001
  - R-002
  sequence: 5
- workset_id: release
  title: Submission
  purpose: Open the upstream pull request with only the team folder after team-lead approval.
  decision_boundary: Has the approved candidate been submitted in the required form?
  exit_conditions:
  - The pull request is open and contains only the team folder.
  prerequisite_workset_ids:
  - assurance
  exit_requirement_ids:
  - R-008
  sequence: 6
constraints:
- Scored and timing evidence uses the pinned container (Python 3.12, PyTorch 2.4.0, CUDA 12.4) on an A100
  80GB PCIe; the submission installs no packages.
- Evaluation is single-view; no test-time augmentation, pretrained weights or external data.
- No real data, seeds or data-derived constants in import or build; no learned or data-derived state carried
  across trials; no offline example-index lists or pruning scores unless the organisers rule them permitted.
- Local Blackwell GPUs produce accuracy evidence only, on the torch 2.7.1+cu128 dev stack; they never
  produce timing claims.
- No measurement interference, host selection or cooldowns.
- A100 80GB PCIe access is an external resource provided by the team lead; calibration and assurance tasks
  record an external blocker with a retry condition until it exists.
- Cross-stack accuracy transfer (dev stack versus pinned A100 stack) is unverified until R-007 has evidence;
  frontier cells within two standard errors of the target are re-measured on the A100 before a regime
  decision.
- Pushing research artefacts to the public fork, renting GPUs and opening the upstream pull request each
  require team-lead approval.
out_of_scope:
- Reporting harness gaps G1 to G6 to the organisers (a separate team-lead decision).
- Multi-GPU training and non-PyTorch frameworks.
- Hackathon track selection.
max_active_tasks: 3
