    statement: In the pinned container on an A100 80GB PCIe with the official launch flags, the entry
      completes 40 fresh trials, every trial succeeds within the 600 s training and 5 s evaluation limits,
      and the mean top-1 exceeds 75% by a margin that keeps the estimated official qualification risk
      at or below 1% given the measured per-trial standard deviation (75.2% when that deviation is at
      most 0.30 pp).
    criticality: core
