schema_version: '2.0'
programme_id: c100-speedrun
title: CIFAR-100 speedrun entry
mission: Submit a rule-compliant CIFAR-100 speedrun entry whose official 40-seed evaluation on one NVIDIA
  A100 80GB PCIe qualifies (mean top-1 at least 75%) at the lowest mean prepare+train time the team can
  demonstrate, with recorded evidence for every adopted and rejected technique.
root_question: Which compliant recipe minimises mean A100 PCIe prepare+train time while keeping the official
  40-seed mean top-1 at or above 75% with a qualification risk of about 1% or less?
