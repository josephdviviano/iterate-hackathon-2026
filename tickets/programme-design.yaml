schema_version: '1.0'
programme_id: c100-speedrun
title: CIFAR-100 speedrun entry
mission: >-
  Submit a rule-compliant CIFAR-100 speedrun entry whose official 40-seed evaluation on one
  NVIDIA A100 80GB PCIe qualifies (mean top-1 at least 75%) at the lowest mean prepare+train
  time the team can demonstrate, with recorded evidence for every adopted and rejected
  technique.
root_question: >-
  Which compliant recipe minimises mean A100 PCIe prepare+train time while keeping the
  official 40-seed mean top-1 at or above 75% with a qualification risk of about 1% or less?
scale: substantial
integration_role: integration_owner

authoritative_sources:
  - source_id: team-directives
    role: human_directive
    locator: research/DIRECTIVES.md
  - source_id: competition-rules
    role: public_contract
    locator: RULES.md
  - source_id: competition-readme
    role: public_contract
    locator: README.md
  - source_id: submission-contract
    role: repository_contract
    locator: submission_template/README.md
  - source_id: harness-worker
    role: repository_contract
    locator: benchmark/worker.py
  - source_id: harness-evaluation
    role: repository_contract
    locator: benchmark/evaluate.py
  - source_id: appraisal-proposal
    role: evidence
    locator: research/PROPOSAL.md

design_evidence:
  - evidence_id: airbench-cifar100-anchor
    kind: observation
    label: airbench96 reaches 79.27% (flip) and 79.76% (flip+Cutout) on CIFAR-100, both with TTA
    locator: research/evidence/airbench-2404.00498v2-tables.txt
    establishes: >-
      An airbench-lineage network clears 75% on CIFAR-100 with roughly 4 pp to spare under
      TTA, so the lineage is a credible base; the single-view gap is unmeasured.
  - evidence_id: airbench-short-budget-regularisation
    kind: observation
    label: Cutout costs 1.14 pp at 10 epochs and 0.38 pp at 20 epochs without TTA; TTA is worth 0.70-0.79 pp
    locator: research/evidence/airbench-2404.00498v2-tables.txt
    establishes: >-
      CIFAR-10 epoch counts from TTA-scored records are optimistic for single-view
      evaluation, and Cutout should start disabled for short budgets.
  - evidence_id: pinned-stack-blackwell-probe
    kind: observation
    label: torch 2.4.0+cu124 has no sm_120 kernels; torch 2.7.1+cu128 runs on the local RTX PRO 6000
    locator: research/evidence/pinned-stack-blackwell.txt
    establishes: >-
      Local GPUs can produce accuracy evidence only on a newer PyTorch; timing and scored
      evidence require an A100 80GB PCIe with the pinned container.
  - evidence_id: resnet-muon-negative-anchor
    kind: observation
    label: Plain ResNet (64/128/256) with Muon reaches 70.6% at 16 epochs (single seed, ~26 s)
    locator: research/evidence/marioPaerle-cifar100speedrun-readme.txt
    establishes: >-
      Optimiser changes alone on a plain ResNet do not reach 75% in a short budget; the
      airbench-lineage sample-efficiency tricks are the primary lever.
  - evidence_id: build-phase-data-reach-probe
    kind: observation
    label: Untimed build() can read train data and test images through the caller frame
    locator: research/evidence/build-frame-probe/RESULT.txt
    establishes: >-
      Compliance cannot be delegated to the harness; the entry needs its own compliance
      review against RULES.md section 3.

success_outcomes:
  - outcome_id: O-001
    statement: A qualifying, compliant submission is demonstrated under official-equivalent conditions.
    requirements:
      - requirement_id: R-001
        criticality: core
        statement: >-
          In the pinned container on an A100 80GB PCIe with the official launch flags, the
          entry completes 40 fresh trials, every trial succeeds within the 600 s training and
          5 s evaluation limits, and the mean top-1 exceeds 75% by a margin that keeps the
          estimated official qualification risk at or below 1% given the measured per-trial
          standard deviation (75.2% when that deviation is at most 0.30 pp).
        obligations:
          - obligation_id: official-equivalent-run
            mode: command
            statement: >-
              benchmark.run with 40 distinct seeds from a seed file, cpus 4, network none,
              produces summary.json with complete true and no eval_timeout, and the recorded
              risk calculation from mean_accuracy and accuracy_std gives at most 1%
              probability of an official mean below 0.75.
      - requirement_id: R-002
        criticality: core
        statement: >-
          The entry satisfies RULES.md sections 1 to 3: no real data, seeds or data-derived
          constants in import or build; no learned state carried across trials; single-view
          evaluation without state change; no test-set use; no measurement interference; only
          pinned dependencies.
        obligations:
          - obligation_id: compliance-inspection
            mode: inspection
            statement: >-
              A fresh-context source review of import, build, prepare, train and forward finds
              no rule violation, recorded against each RULES.md section 3 bullet.
          - obligation_id: independence-checks
            mode: command
            statement: >-
              Repeat-seed and reordered-seed runs reproduce per-seed accuracy within
              nondeterminism, and a fresh process reproduces the first trial.
  - outcome_id: O-002
    statement: The submitted recipe is the fastest qualifying configuration the evidence supports.
    requirements:
      - requirement_id: R-003
        criticality: core
        statement: >-
          The base regime (architecture, width, depth, batch size, epochs) is selected as the
          minimum interpolated A100 PCIe time at which the single-view 5-seed mean reaches
          75.3%, over a measured frontier of at least four widths and four epoch counts.
        obligations:
          - obligation_id: frontier-table
            mode: command
            statement: >-
              The collation command reproduces the width by epochs accuracy table (mean, sd, n)
              from raw harness results.
          - obligation_id: regime-decision
            mode: inspection
            statement: >-
              A decision record selects the regime from the frontier table and the A100 per-epoch
              timings and states its reopening conditions.
      - requirement_id: R-004
        criticality: core
        statement: >-
          Each add-on lever (optimiser, resolution schedule, example selection, regularisation)
          is adopted only if it lowers time at matched accuracy beyond seed noise over at least
          10 seeds at the selected base; every rejected lever has a recorded reason.
        obligations:
          - obligation_id: addon-comparisons
            mode: command
            statement: >-
              Collated matched-accuracy comparisons with confidence intervals exist for every
              tested lever.
          - obligation_id: addon-decision
            mode: inspection
            statement: A decision record lists adopted and rejected levers with their evidence.
      - requirement_id: R-005
        criticality: core
        statement: >-
          A100 80GB PCIe per-epoch and fixed preparation times are measured in the pinned
          container for every frontier candidate, and the final recipe's 40-trial mean time is
          recorded with its standard deviation and GPU telemetry.
        obligations:
          - obligation_id: a100-timing-table
            mode: command
            statement: >-
              Harness runs on the A100 PCIe report total_timed_time per candidate with clocks,
              power and temperature telemetry.
  - outcome_id: O-003
    statement: Exploration is reproducible, resumable and scales across available GPUs and agents.
    requirements:
      - requirement_id: R-006
        criticality: supporting
        statement: >-
          Any configuration in the exploration space runs from a declarative sweep file on any
          free local GPU through the official harness, resumes after interruption without
          repeating completed runs, and its collated tables are reproducible from raw results.
        obligations:
          - obligation_id: sweep-roundtrip
            mode: command
            statement: >-
              A multi-config, multi-GPU sweep completes, an interrupted sweep resumes without
              rerunning completed configs, and collation reproduces the same table.
      - requirement_id: R-007
        criticality: supporting
        statement: >-
          Single-view accuracy measured on the local development stack agrees with the pinned
          A100 stack within two standard errors for a reference configuration, or the
          discrepancy is quantified and applied as a correction.
        obligations:
          - obligation_id: cross-stack-agreement
            mode: command
            statement: >-
              The same configuration run for 10 seeds on both stacks yields means whose
              difference is within two combined standard errors.
  - outcome_id: O-004
    statement: The submission reaches the organisers in the required form with team-lead approval.
    requirements:
      - requirement_id: R-008
        criticality: core
        statement: >-
          The pull request to the upstream repository adds only submissions/<team>/ with its
          source and README, runs its final recipe from default settings, contains no weights,
          data or results, and was approved by the team lead before opening.
        obligations:
          - obligation_id: pr-contents
            mode: inspection
            statement: The PR diff touches only the team folder and the defaults reproduce R-001.
          - obligation_id: release-approval
            mode: inspection
            statement: A recorded human decision approves opening the PR.

worksets:
  - workset_id: enablement
    sequence: 1
    title: Exploration enablement
    purpose: >-
      Provide the development stack, the parametrised recipe substrate and the sweep tooling
      that every probe depends on.
    decision_boundary: Can the team run the exploration grid at scale and trust its outputs?
    exit_conditions:
      - A multi-GPU sweep through the official harness completes and resumes after interruption.
      - The recipe substrate passes the harness smoke test and the repeat-seed reset test.
    exit_requirement_ids: [R-006]
  - workset_id: calibration
    sequence: 3
    prerequisite_workset_ids: [enablement]
    title: A100 PCIe calibration
    purpose: >-
      Measure per-epoch time on the official hardware and check that local accuracy evidence
      transfers to the pinned stack.
    decision_boundary: Which time model and which accuracy correction apply to frontier decisions?
    exit_conditions:
      - Per-epoch A100 PCIe time is known for every frontier candidate.
      - Cross-stack accuracy agreement is established or quantified.
    exit_requirement_ids: [R-005, R-007]
  - workset_id: frontier
    sequence: 2
    prerequisite_workset_ids: [enablement]
    title: Width by epochs frontier
    purpose: Measure where single-view accuracy crosses 75.3% across widths, depths and epochs.
    decision_boundary: Is the competition capacity-bound or throughput-bound, and which base regime wins?
    exit_conditions:
      - The frontier table exists with at least five seeds per cell.
      - A regime decision record exists.
    exit_requirement_ids: [R-003]
  - workset_id: addons
    sequence: 4
    prerequisite_workset_ids: [frontier, calibration]
    title: Add-on levers at the selected base
    purpose: >-
      Test optimiser, resolution, example-selection and regularisation levers at matched
      accuracy on the selected base.
    decision_boundary: Which levers enter the final recipe?
    exit_conditions:
      - Every tested lever has a matched-accuracy comparison and a disposition.
    exit_requirement_ids: [R-004]
  - workset_id: assurance
    sequence: 5
    prerequisite_workset_ids: [addons]
    title: Convergence and assurance
    purpose: >-
      Converge the final recipe into a lean submission and challenge it under
      official-equivalent conditions and a compliance review.
    decision_boundary: Is the exact candidate qualifying, compliant and ready to submit?
    exit_conditions:
      - The official-equivalent 40-seed run qualifies with margin.
      - The compliance review finds no violation.
    exit_requirement_ids: [R-001, R-002]
  - workset_id: release
    sequence: 6
    prerequisite_workset_ids: [assurance]
    title: Submission
    purpose: Open the upstream pull request with only the team folder after team-lead approval.
    decision_boundary: Has the approved candidate been submitted in the required form?
    exit_conditions:
      - The pull request is open and contains only the team folder.
    exit_requirement_ids: [R-008]

actors:
  - actor_id: team-lead
    kind: human_authority
    name: Team lead (Bradley Segal)
    context: Owns the entry, compute budget, public disclosure and the decision to submit.
    goals:
      - Win or place with a compliant entry.
      - Keep strategy private until submission when that matters.
    authority: >-
      Approves rented-GPU spend, pushing research artefacts to the public fork, and opening
      the upstream pull request.
    failure_stakes: Disqualification, wasted compute budget or premature disclosure of strategy.
  - actor_id: research-agent
    kind: operator
    name: Research agent
    context: A Claude session or teammate executing probes and sweeps from programme tasks.
    goals:
      - Run discriminating probes within budget.
      - Record exact evidence and findings.
    authority: Runs experiments on local GPUs and approved rented GPUs; cannot submit or push.
    failure_stakes: Misleading accuracy or timing evidence that selects the wrong regime.
  - actor_id: organisers
    kind: auditor
    name: Competition organisers
    context: Run the official 40-seed evaluation and review finalists' source against RULES.md.
    goals:
      - Score entries fairly.
      - Detect rule violations.
    authority: Qualify or disqualify the entry.
    failure_stakes: A compliant entry misjudged, or a violating entry accepted.
  - actor_id: maintainer
    kind: maintainer
    name: Programme maintainer
    context: Any agent or teammate resuming the programme from its tracker.
    goals:
      - Resume from durable state without rereading the conversation.
    authority: Selects and starts eligible tasks; updates findings and decisions.
    failure_stakes: Repeated or obsolete work after a handoff.

scenarios:
  - scenario_id: S-001
    title: Run a frontier sweep
    kind: happy_path
    critical: true
    actor_ids: [research-agent]
    trigger: A frontier or add-on exploration task starts.
    preconditions:
      - The dev stack and CIFAR-100 data are present.
      - A sweep file declares the configurations and seeds.
    steps:
      - The agent launches the sweep across free GPUs.
      - Each configuration runs through the official harness with diagnostic accuracy reporting.
      - Collation aggregates per-configuration mean, sd and n.
    observable_outcome: A table of mean single-view accuracy with sd and n for every swept configuration.
    failure_conditions:
      - A configuration crashes, diverges or exceeds limits.
      - Dev-stack accuracy disagrees with the pinned A100 stack near the threshold.
    requirement_ids: [R-003, R-004, R-006, R-007]
  - scenario_id: S-002
    title: Official-equivalent qualification run
    kind: happy_path
    critical: true
    actor_ids: [research-agent, team-lead]
    trigger: A converged candidate is ready for assurance.
    preconditions:
      - Approved A100 80GB PCIe access.
      - The pinned container image is built with the frozen candidate.
    steps:
      - Run the official command with a 40-seed file, cpus 4 and network none.
      - Record summary.json, trials.jsonl and telemetry.
    observable_outcome: summary.json reports complete true with a mean whose margin over 0.75 meets the R-001 risk bound.
    failure_conditions:
      - Any trial fails or the margin over 0.75 misses the R-001 risk bound.
    recovery: Return to the add-ons workset with the failure interpreted, never retry by selecting seeds.
    requirement_ids: [R-001, R-005]
  - scenario_id: S-003
    title: A configuration fails during a sweep
    kind: negative_path
    critical: true
    actor_ids: [research-agent]
    trigger: A run raises, runs out of memory, produces nonfinite logits or exceeds a limit.
    preconditions:
      - A sweep is running.
    steps:
      - The harness records the failure and exits non-zero.
      - The sweep marks the configuration failed and continues with other work.
      - Collation reports the failure instead of dropping it.
    observable_outcome: The failed configuration appears in the table as failed with its error location.
    requirement_ids: [R-006]
  - scenario_id: S-004
    title: Resume an interrupted sweep
    kind: recovery
    critical: true
    actor_ids: [research-agent, maintainer]
    trigger: A sweep is interrupted by Ctrl-C, preemption or a GPU fault.
    preconditions:
      - Some configurations have complete results.
    steps:
      - Rerun the same sweep file.
      - Completed configurations are skipped; incomplete ones rerun from scratch.
    observable_outcome: The resumed sweep finishes and collation matches an uninterrupted sweep.
    recovery: Partial harness results are preserved and excluded from collation until complete.
    requirement_ids: [R-006]
  - scenario_id: S-005
    title: Compliance review of the final candidate
    kind: audit
    critical: true
    actor_ids: [organisers]
    trigger: The converged candidate is frozen.
    preconditions:
      - The candidate source is frozen in the team folder.
    steps:
      - Inspect import, build, prepare, train and forward against each RULES.md section 3 bullet.
      - Run repeat-seed, reordered-seed and fresh-process checks.
    observable_outcome: A review record with a verdict per rule and the independence check results.
    failure_conditions:
      - Any rule bullet is violated or not evaluable.
    requirement_ids: [R-002]
  - scenario_id: S-006
    title: Submit the entry
    kind: release
    critical: true
    actor_ids: [team-lead]
    trigger: Assurance completes favourably.
    preconditions:
      - A recorded human decision approves submission.
    steps:
      - Create a clean branch from upstream main containing only the team folder.
      - Open the pull request to the upstream repository.
    observable_outcome: An open upstream pull request whose diff contains only submissions/<team>/.
    requirement_ids: [R-008]
  - scenario_id: S-007
    title: Resume the programme after a handoff
    kind: maintenance
    critical: false
    actor_ids: [maintainer]
    trigger: A new session or teammate picks up the work.
    preconditions:
      - The programme workspace and tracker are current.
    steps:
      - Render the resume prompt and read open feedback.
      - Continue active work or select an eligible task by consequence.
    observable_outcome: The next task starts without repeating completed work.
    requirement_ids: [R-006]

behaviour_views:
  - view_id: sweep-pipeline
    title: Sweep execution
    owner: research-agent
    scenario_ids: [S-001, S-003, S-004]
    ingress:
      - A declarative sweep file naming configurations, parameters and seeds.
    decisions:
      - Which configurations are already complete and are skipped.
      - Which free GPU slot runs the next configuration.
    state_transitions:
      - pending to running to complete or failed.
    effects:
      - Harness result directories per configuration.
      - A collated table of accuracy and time per configuration.
    failure_modes:
      - Harness error, out of memory, divergence, timeout or interruption.
    observability:
      - Per-configuration summary.json and trials.jsonl from the harness.
      - A sweep log recording slot assignment and exit codes.
    validation:
      - Sweep files are validated before any run starts.
      - Collation counts only complete runs and lists failures.
  - view_id: trial-lifecycle
    title: Submission trial lifecycle
    owner: integration_owner
    scenario_ids: [S-002, S-005]
    ingress:
      - The harness calls build once, then prepare and train for each seed.
    decisions:
      - Recipe parameters select architecture, optimiser, schedule and augmentation.
    state_transitions:
      - build with synthetic warm-up, then per-trial in-place reset, then training, then evaluation.
    effects:
      - A trained nn.Module returned for single-view evaluation.
    failure_modes:
      - Lazy compilation inside evaluation, state leaking across trials, nonfinite logits.
    observability:
      - Harness prepare_time, train_time and evaluation_time per trial.
    validation:
      - Harness interface, prediction and evaluation-state checks.
      - Repeat-seed reset test.
  - view_id: release-pipeline
    title: Submission release
    owner: team-lead
    scenario_ids: [S-006]
    ingress:
      - A favourable assurance record and a team-lead approval decision.
    decisions:
      - Whether the frozen candidate is approved for submission.
    state_transitions:
      - approved candidate to clean branch from upstream main to open pull request.
    effects:
      - An upstream pull request containing only submissions/<team>/.
    failure_modes:
      - Research files or results leak into the pull request diff.
      - The defaults do not reproduce the assured recipe.
    observability:
      - The pull request diff and its file list.
    validation:
      - Diff inspection restricted to the team folder before opening.
      - A default-settings harness run of the release branch.

surfaces:
  - surface_id: submission-folder
    title: Team submission folder
    purpose: The entry evaluated by the organisers.
    audience_actor_ids: [organisers, team-lead]
    scenario_ids: [S-002, S-005, S-006]
    requirement_ids: [R-001, R-002, R-008]
    failure_contract: Harness errors or rule violations prevent qualification.
    evidence_exposure: Source, README and harness results; no weights, data or results are committed.
  - surface_id: exploration-tooling
    title: Sweep and collation tooling
    purpose: Run and summarise exploration at scale.
    audience_actor_ids: [research-agent, maintainer]
    scenario_ids: [S-001, S-003, S-004]
    requirement_ids: [R-003, R-004, R-006]
    failure_contract: Failed configurations are reported, never silently dropped.
    evidence_exposure: Raw harness results under results/ (git-ignored) and collated tables cited by findings.
  - surface_id: programme-tracker
    title: Programme tracker
    purpose: Human-readable programme state and steering.
    audience_actor_ids: [team-lead, maintainer]
    scenario_ids: [S-007]
    requirement_ids: [R-006]
    failure_contract: Programme commands fail before mutating state if the tracker is damaged.
    evidence_exposure: Links to findings, decisions and collated tables.

concern_assessments:
  - concern: failure_recovery
    applicable: true
    rationale: Long sweeps are interrupted, and a failed official-equivalent run must redirect work rather than be retried by seed selection.
    scenario_ids: [S-003, S-004, S-002]
  - concern: auditability
    applicable: true
    rationale: Organisers review finalists' source, and every regime and lever decision must trace to collated results.
    scenario_ids: [S-005, S-001]
  - concern: accessibility
    applicable: false
    rationale: There is no end-user interface; the surfaces are command-line tooling and source code for a small team.
  - concern: security_privacy
    applicable: true
    rationale: The fork is public, so pushing research artefacts discloses strategy; GPU rental credentials must stay out of the repository.
    scenario_ids: [S-006]
  - concern: performance_scale
    applicable: true
    rationale: Training time is the score, and exploration throughput across GPUs and agents limits how much of the design space can be measured.
    scenario_ids: [S-001, S-002]
  - concern: documentation
    applicable: true
    rationale: Organisers need a submission README, and agents need an executable runbook to run and resume sweeps.
    scenario_ids: [S-004, S-006, S-007]
  - concern: maintainability
    applicable: true
    rationale: Exploration flags must not survive into the submitted recipe; the final candidate is simplified before assurance.
    scenario_ids: [S-005]

assumptions: []

alternatives:
  - alternative_id: ALT-001
    statement: Measure the single-view width by epochs frontier on an airbench-lineage substrate, then select the regime and add-ons from evidence.
    disposition: selected
    rationale: >-
      The only CIFAR-100 anchor is TTA-scored and CIFAR-10 epoch counts do not transfer, so
      the regime must be measured before optimiser or kernel investment.
    strengths:
      - Separates capacity-bound and throughput-bound accounts with one bounded probe.
      - Uses the official harness, so evidence matches the scoring semantics.
    limitations:
      - Local accuracy needs a cross-stack check (R-007).
    distinguishing_predictions:
      - If the minimum-time cell is narrow and short, systems work dominates; if wide and long, sample efficiency dominates.
    evidence_refs: [airbench-cifar100-anchor, airbench-short-budget-regularisation]
  - alternative_id: ALT-002
    statement: Port a CIFAR-10 record recipe (airbench96 or the hiverge record) wholesale and tune only epochs.
    disposition: rejected
    rationale: Every CIFAR-10 record is scored with test-time augmentation, which RULES.md bans, and its regularisation is tuned for TTA-scored CIFAR-10.
    strengths:
      - Fastest path to a first qualifying run.
    limitations:
      - Epoch counts and Cutout settings are optimistic without TTA.
    distinguishing_predictions:
      - Wholesale airbench96 at 40 epochs would qualify but at roughly 35 to 46 s, far from the frontier minimum.
    evidence_refs: [airbench-short-budget-regularisation, competition-rules]
  - alternative_id: ALT-003
    statement: Keep a plain ResNet and change only the optimiser and systems stack.
    disposition: superseded
    rationale: >-
      A plain ResNet with Muon reaches only about 70.6% in 16 epochs; the optimiser and
      systems levers remain available as add-ons on the selected base.
    strengths:
      - Simple to implement.
    limitations:
      - Lacks the sample-efficiency tricks that dominate short budgets.
    distinguishing_predictions:
      - Without airbench tricks, epochs to 75% exceed the airbench-lineage frontier.
    evidence_refs: [resnet-muon-negative-anchor]

documentation:
  - document_id: submission-readme
    title: Submission README
    purpose: Describe the recipe, its parameters and its compliance with RULES.md for the organisers.
    audience_actor_ids: [organisers]
    scenario_ids: [S-005, S-006]
    executable: true
    covers_recovery: false
  - document_id: exploration-runbook
    title: Exploration runbook
    purpose: >-
      Set up the dev stack, run and resume sweeps, interpret failed configurations, collate
      results, run the official-equivalent A100 check and hand over between agents.
    audience_actor_ids: [research-agent, maintainer]
    scenario_ids: [S-001, S-002, S-003, S-004, S-007]
    executable: true
    covers_recovery: true

review_paths:
  - review_id: compliance-review
    reviewer_actor_id: organisers
    entry_surfaces: [submission-folder]
    requirement_ids: [R-002]
    scenario_ids: [S-005]
    trace:
      - Module import and build use only synthetic inputs.
      - prepare resets all learned state in place and does all data work.
      - train finishes all work before returning.
      - forward is single-view and stateless.
    expected_evidence:
      - Per-rule verdicts against RULES.md section 3.
      - Repeat-seed, reordered-seed and fresh-process check results.
  - review_id: decision-review
    reviewer_actor_id: team-lead
    entry_surfaces: [programme-tracker, exploration-tooling]
    requirement_ids: [R-003, R-004]
    scenario_ids: [S-001]
    trace:
      - Sweep file to harness results to collated table to decision record.
    expected_evidence:
      - Frontier and add-on tables reproduced by the collation command.
      - Decision records with reopening conditions.
  - review_id: qualification-review
    reviewer_actor_id: team-lead
    entry_surfaces: [submission-folder, exploration-tooling]
    requirement_ids: [R-001, R-005]
    scenario_ids: [S-002]
    trace:
      - Frozen candidate to pinned container on the A100 PCIe to summary.json, trials.jsonl and telemetry.
    expected_evidence:
      - summary.json with complete true over 40 seeds and the R-001 risk calculation.
      - Per-trial timing with SM clock, power and temperature telemetry.
  - review_id: release-review
    reviewer_actor_id: team-lead
    entry_surfaces: [submission-folder]
    requirement_ids: [R-008]
    scenario_ids: [S-006]
    trace:
      - Assurance record to approval decision to clean branch diff to pull request.
    expected_evidence:
      - Pull request file list restricted to the team folder.
      - Recorded approval decision.

operating_envelopes:
  - envelope_id: trial-time
    dimension: prepare plus train wall time per trial
    measurement: harness total_timed_time on the A100 80GB PCIe in the pinned container
    normal_case: 5 to 25 s for frontier candidates
    stress_case: up to 60 s for wide, long early configurations
    failure_limit: 600 s per trial (harness limit)
  - envelope_id: evaluation-time
    dimension: single-view inference over 10,000 test images
    measurement: harness evaluation_time
    normal_case: under 0.3 s with warmed eval shapes
    stress_case: first call with lazy compilation of the 784-image final batch
    failure_limit: 5 s per trial (harness limit)
  - envelope_id: accuracy-margin
    dimension: development mean single-view accuracy
    measurement: mean over at least 40 development seeds through the harness
    normal_case: at least 75.2% with sd at most 0.35 pp
    stress_case: sd up to 0.45 pp requiring a 75.3% target
    failure_limit: official 40-seed mean below 75.0%
  - envelope_id: build-time
    dimension: untimed import plus build
    measurement: harness build_time
    normal_case: under 300 s including compilation and autotuning
    stress_case: max-autotune over several input shapes
    failure_limit: 600 s (harness limit)

constraints:
  - Scored and timing evidence uses the pinned container (Python 3.12, PyTorch 2.4.0, CUDA 12.4) on an A100 80GB PCIe; the submission installs no packages.
  - Evaluation is single-view; no test-time augmentation, pretrained weights or external data.
  - No real data, seeds or data-derived constants in import or build; no learned or data-derived state carried across trials; no offline example-index lists or pruning scores unless the organisers rule them permitted.
  - Local Blackwell GPUs produce accuracy evidence only, on the torch 2.7.1+cu128 dev stack; they never produce timing claims.
  - No measurement interference, host selection or cooldowns.
  - A100 80GB PCIe access is an external resource provided by the team lead; calibration and assurance tasks record an external blocker with a retry condition until it exists.
  - Cross-stack accuracy transfer (dev stack versus pinned A100 stack) is unverified until R-007 has evidence; frontier cells within two standard errors of the target are re-measured on the A100 before a regime decision.
  - Pushing research artefacts to the public fork, renting GPUs and opening the upstream pull request each require team-lead approval.

out_of_scope:
  - Reporting harness gaps G1 to G6 to the organisers (a separate team-lead decision).
  - Multi-GPU training and non-PyTorch frameworks.
  - Hackathon track selection.

max_active_tasks: 3
