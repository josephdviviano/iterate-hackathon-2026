[project]
name = "committee"
version = "0.1.0"
description = "A committee of exact-replay-consistent programs as an uncertainty-aware world model for ARC-AGI-3."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "modal>=1.6.0",
    "openai>=3.24.0",
    "httpx>=0.28.1",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/committee", "src/rewardhack", "src/hoeffding"]

[tool.pytest.ini_options]
testpaths = ["tests"]
